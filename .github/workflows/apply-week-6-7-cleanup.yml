name: Apply Week 6 and 7 cleanup

on:
  push:
    branches: [cleanup-weeks-6-7]
    paths:
      - scripts/cleanup_weeks_6_7.py
      - .github/workflows/apply-week-6-7-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted Week 6 and 7 cleanup
        run: python scripts/cleanup_weeks_6_7.py
      - name: Commit cleaned dashboard
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-for-managers-dashboard/app/page.tsx
          git commit -m "Clean up Week 6 and Week 7 course modules"
          git push
