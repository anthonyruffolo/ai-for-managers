name: Stabilize course integration

on:
  push:
    branches:
      - stabilize/course-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v4
        with:
          ref: stabilize/course-integration
          fetch-depth: 0

      - name: Apply deterministic stabilization
        run: python scripts/stabilize_course_integration.py

      - name: Remove one-time stabilization tooling
        run: |
          rm scripts/stabilize_course_integration.py
          rm .github/workflows/stabilize-course-integration.yml

      - name: Commit integrated dashboard changes
        run: |
          git config user.name "Anthony course integration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize weekly course content integration" -m "Scope specialized lesson content to the weeks that own it so Week 10 academic-integrity material cannot leak into other modules. Align Weeks 8, 9, 11, and 12 roadmap copy with their structured modules, fix the Week 10 plagiarism label, and carry forward safe Week 6/7 validation and case improvements from the stale cleanup branch."
          git push origin HEAD:stabilize/course-integration
